name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/rajeswararao89/wisecow
  CLUSTER_NAME: wisecow-cluster

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify build files
      run: |
        ls -la
        if [ -f wisecow-fixed.sh ]; then
          echo "wisecow-fixed.sh found"
          head -5 wisecow-fixed.sh
        else
          echo "wisecow-fixed.sh not found"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: $IMAGE_NAME:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Push to GitHub Container Registry
      run: |
        docker push $IMAGE_NAME:latest

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kubernetes tools
      uses: engineerd/setup-kind@v0.6.0
      with:
        version: "v0.20.0"

    - name: Create Kind cluster
      run: |
        cat > kind-config.yaml << 'EOC'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
        EOC
        kind create cluster --name $CLUSTER_NAME --config kind-config.yaml

    - name: Build and load image to Kind
      run: |
        docker build -t $IMAGE_NAME:latest .
        kind load docker-image $IMAGE_NAME:latest --name $CLUSTER_NAME

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f kubernetes/
        kubectl rollout status deployment/wisecow --timeout=300s

    - name: Run smoke test
      run: |
        kubectl port-forward service/wisecow-service 8080:80 &
        sleep 10
        curl -f http://localhost:8080 || exit 1
        pkill -f "port-forward"
